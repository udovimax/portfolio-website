name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Git LFS bandwidth is currently exhausted. The latest successful Pages
      # artifact already contains the complete optimized media bundle, so use
      # it as the media base while rebuilding the application shell. This keeps
      # code-only fixes deployable without replacing media with LFS pointers.
      - name: Restore existing media artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 9122155669
          run-id: 31545033343
          path: previous-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Restore optimized media
        run: |
          rm -rf dist/media
          cp -a ../previous-pages/media dist/media

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
