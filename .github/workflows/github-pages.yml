name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Git LFS bandwidth is currently exhausted. Reuse the latest successful
      # Pages artifact as the media base while rebuilding the application
      # shell. Keep the freshly built JS/CSS/HTML so code-only fixes are not
      # overwritten by an older full-site artifact.
      - name: Find latest successful Pages artifact
        id: find-pages-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'github-pages.yml',
              status: 'completed',
              per_page: 20,
            });

            const previousRun = data.workflow_runs.find((run) => (
              run.id !== context.runId && run.conclusion === 'success'
            ));

            if (!previousRun) {
              core.setFailed('No previous successful Pages workflow run is available to restore media from.');
              return;
            }

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: previousRun.id,
              per_page: 100,
            });
            const pagesArtifact = artifacts.artifacts.find((artifact) => (
              artifact.name === 'github-pages' && !artifact.expired
            ));

            if (!pagesArtifact) {
              core.setFailed(`Pages artifact for successful run ${previousRun.id} is missing or expired.`);
              return;
            }

            core.setOutput('artifact_id', String(pagesArtifact.id));
            core.setOutput('run_id', String(previousRun.id));
            core.info(`Restoring media from Pages artifact ${pagesArtifact.id} (run ${previousRun.id}).`);

      - name: Restore existing media artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.find-pages-artifact.outputs.artifact_id }}
          run-id: ${{ steps.find-pages-artifact.outputs.run_id }}
          path: previous-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Restore optimized media only
        run: |
          mkdir -p ../previous-pages/extracted
          tar -xf ../previous-pages/github-pages/artifact.tar -C ../previous-pages/extracted ./media
          cp -R ../previous-pages/extracted/media dist/media

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
