<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Max Portfolio — Enquiries</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b10;
        --panel: #101720;
        --panel-strong: #151f2b;
        --line: rgba(205, 255, 216, .2);
        --text: #f5f7f4;
        --muted: #aab5bb;
        --accent: #a6c8ff;
        --success: #cdffd8;
        --danger: #ffb7b7;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 10% 0%, #172536 0, transparent 42%), var(--bg);
        color: var(--text);
        font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
      header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 28px; }
      .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 0; font-size: clamp(2rem, 6vw, 4.5rem); font-weight: 450; letter-spacing: -.055em; line-height: .98; }
      h2 { margin-bottom: 14px; font-size: 1.1rem; font-weight: 500; }
      .muted { color: var(--muted); }
      .button { border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--text); padding: 9px 14px; }
      .button:hover, .button:focus-visible { border-color: var(--accent); color: var(--accent); }
      .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 24px; }
      .stat, .panel { border: 1px solid var(--line); border-radius: 18px; background: rgba(16, 23, 32, .86); }
      .stat { padding: 15px; }
      .stat strong { display: block; margin-top: 3px; font-size: 1.75rem; font-weight: 450; }
      .stat span { color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .layout { display: grid; grid-template-columns: minmax(260px, .85fr) minmax(0, 1.5fr); gap: 16px; align-items: start; }
      .panel { padding: 18px; }
      .panel-heading { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
      .lead-list { display: grid; gap: 8px; max-height: 680px; overflow: auto; }
      .lead-row { width: 100%; border: 1px solid transparent; border-radius: 12px; background: rgba(255,255,255,.035); color: inherit; padding: 12px; text-align: left; }
      .lead-row:hover, .lead-row[aria-current="true"] { border-color: var(--accent); background: rgba(166, 200, 255, .08); }
      .lead-row-top, .lead-row-bottom { display: flex; justify-content: space-between; gap: 10px; }
      .lead-row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lead-row-bottom { margin-top: 5px; color: var(--muted); font-size: 12px; }
      .badge { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; color: var(--success); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
      .badge.priority { color: var(--accent); }
      .empty { color: var(--muted); padding: 28px 0; }
      .detail { display: grid; gap: 16px; }
      .detail-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .meta-item span, label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
      .meta-item strong, .meta-item a { color: var(--text); font-weight: 450; overflow-wrap: anywhere; }
      .message { margin: 0; border-left: 2px solid var(--accent); background: rgba(255,255,255,.03); padding: 12px 14px; white-space: pre-wrap; }
      .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .field-full { grid-column: 1 / -1; }
      input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.24); color: var(--text); padding: 10px 11px; }
      textarea { min-height: 100px; resize: vertical; }
      .reply { border-top: 1px solid var(--line); padding-top: 16px; }
      .reply-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
      .success { color: var(--success); }
      .error { color: var(--danger); }
      .pages { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
      .page-count { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--muted); }
      .page-count strong { color: var(--text); }
      @media (max-width: 800px) {
        .stats { grid-template-columns: repeat(2, 1fr); }
        .layout { grid-template-columns: 1fr; }
        .lead-list { max-height: 330px; }
      }
      @media (max-width: 480px) {
        .shell { width: min(100% - 22px, 1180px); padding-top: 18px; }
        header { align-items: start; flex-direction: column; }
        .stats, .detail-meta, .form-grid { grid-template-columns: 1fr; }
        .field-full { grid-column: auto; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">Private dashboard</p>
          <h1>Enquiries</h1>
          <p class="muted" id="account">Loading Max's workspace…</p>
        </div>
        <button class="button" id="refresh" type="button">Refresh</button>
      </header>

      <section class="stats" id="stats" aria-label="Enquiry and site statistics"></section>

      <section class="panel" style="margin-bottom:16px">
        <div class="panel-heading"><h2>Site views · last 30 days</h2><span class="muted">No cookies or personal tracking</span></div>
        <div class="pages" id="pages"></div>
      </section>

      <div class="layout">
        <section class="panel">
          <div class="panel-heading"><h2>Enquiries</h2><span class="muted" id="lead-count"></span></div>
          <div class="lead-list" id="lead-list"></div>
        </section>

        <section class="panel" id="detail-panel">
          <div class="empty">Select an enquiry to view the message, update its status, or reply.</div>
        </section>
      </div>
      <p id="notice" aria-live="polite"></p>
    </main>

    <script>
      var state = { data: null, selectedRow: null };

      function serverCall(name) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
          var runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(function (error) { reject(new Error(error && error.message ? error.message : error)); });
          runner[name].apply(runner, args);
        });
      }

      function node(tag, className, value) {
        var element = document.createElement(tag);
        if (className) element.className = className;
        if (value !== undefined) element.textContent = value;
        return element;
      }

      function showNotice(message, type) {
        var notice = document.getElementById('notice');
        notice.className = type || 'muted';
        notice.textContent = message || '';
      }

      function renderStats(stats) {
        var items = [
          ['New', stats.newLeads],
          ['Total enquiries', stats.totalLeads],
          ['Replied', stats.repliedLeads],
          ['Booked', stats.bookedLeads],
          ['Views · 30 days', stats.viewsLast30Days],
        ];
        var container = document.getElementById('stats');
        container.replaceChildren();
        items.forEach(function (item) {
          var card = node('div', 'stat');
          card.appendChild(node('span', '', item[0]));
          card.appendChild(node('strong', '', String(item[1] || 0)));
          container.appendChild(card);
        });
      }

      function renderPages(stats) {
        var container = document.getElementById('pages');
        container.replaceChildren();
        var pages = Object.keys(stats.viewsByPage || {}).sort();
        if (!pages.length) {
          container.appendChild(node('span', 'muted', 'No page views recorded yet.'));
          return;
        }
        pages.forEach(function (page) {
          var item = node('span', 'page-count');
          item.appendChild(node('strong', '', page + ' '));
          item.appendChild(document.createTextNode(String(stats.viewsByPage[page])));
          container.appendChild(item);
        });
      }

      function renderLeads(leads) {
        var container = document.getElementById('lead-list');
        document.getElementById('lead-count').textContent = leads.length + (leads.length === 1 ? ' record' : ' records');
        container.replaceChildren();
        if (!leads.length) {
          container.appendChild(node('p', 'empty', 'No enquiries yet.'));
          return;
        }
        leads.forEach(function (lead) {
          var button = node('button', 'lead-row');
          button.type = 'button';
          button.setAttribute('aria-current', String(lead.row === state.selectedRow));
          button.addEventListener('click', function () { state.selectedRow = lead.row; render(); });
          var top = node('div', 'lead-row-top');
          top.appendChild(node('strong', 'lead-row-name', lead.name || 'Unnamed enquiry'));
          top.appendChild(node('span', 'badge', lead.status));
          var bottom = node('div', 'lead-row-bottom');
          bottom.appendChild(node('span', '', lead.interest));
          bottom.appendChild(node('span', '', lead.receivedAt));
          button.appendChild(top);
          button.appendChild(bottom);
          container.appendChild(button);
        });
      }

      function renderDetail() {
        var panel = document.getElementById('detail-panel');
        var lead = (state.data.leads || []).find(function (item) { return item.row === state.selectedRow; });
        if (!lead) {
          panel.replaceChildren(node('div', 'empty', 'Select an enquiry to view the message, update its status, or reply.'));
          return;
        }

        panel.replaceChildren();
        var title = node('div', 'panel-heading');
        title.appendChild(node('h2', '', lead.subject || 'Portfolio enquiry'));
        title.appendChild(node('span', 'badge priority', lead.priority));
        panel.appendChild(title);

        var meta = node('div', 'detail-meta');
        var metaItems = [['Name', lead.name], ['Email', lead.email], ['Interest', lead.interest], ['Received', lead.receivedAt]];
        if (lead.bookingDate || lead.bookingTime) {
          var booking = [lead.bookingDate, lead.bookingTime].filter(Boolean).join(' from ');
          if (lead.bookingEndTime) booking += ' to ' + lead.bookingEndTime;
          metaItems.push(['Requested booking', booking]);
        }
        if (lead.confirmationSent) metaItems.push(['Customer confirmation', lead.confirmationSent]);
        if (lead.projectUrl) metaItems.push(['Project URL', lead.projectUrl]);
        metaItems.forEach(function (item) {
          var wrapper = node('div', 'meta-item');
          wrapper.appendChild(node('span', '', item[0]));
          if (item[0] === 'Email' || item[0] === 'Project URL') {
            var link = node('a', '', item[1]);
            link.href = item[0] === 'Email' ? 'mailto:' + item[1] : item[1];
            if (item[0] === 'Project URL') {
              link.target = '_blank';
              link.rel = 'noreferrer';
            }
            wrapper.appendChild(link);
          } else wrapper.appendChild(node('strong', '', item[1] || '—'));
          meta.appendChild(wrapper);
        });
        panel.appendChild(meta);
        panel.appendChild(node('p', 'message', lead.message || 'No message supplied.'));

        var form = node('form', 'detail');
        form.addEventListener('submit', function (event) {
          event.preventDefault();
          saveLead(form, lead.row);
        });
        var grid = node('div', 'form-grid');
        var status = field('Status', 'select', lead.status, ['New', 'Contacted', 'Replied', 'Booked', 'Declined', 'Complete', 'Archived']);
        var priority = field('Priority', 'select', lead.priority, ['Normal', 'High', 'Urgent']);
        var followUp = field('Follow-up', 'input', lead.followUp, []);
        followUp.input.type = 'date';
        var notes = field('Notes', 'textarea', lead.notes, []);
        notes.wrapper.className += ' field-full';
        [status, priority, followUp, notes].forEach(function (item) { grid.appendChild(item.wrapper); });
        form.appendChild(grid);
        var save = node('button', 'button', 'Save enquiry');
        save.type = 'submit';
        form.appendChild(save);
        panel.appendChild(form);

        var reply = node('div', 'reply');
        reply.appendChild(node('h2', '', 'Reply from Max'));
        var replySubject = field('Subject', 'input', 'Re: ' + (lead.subject || 'Portfolio enquiry'), []);
        var replyMessage = field('Message', 'textarea', '', []);
        replyMessage.input.placeholder = 'Write a response to this enquiry…';
        reply.appendChild(replySubject.wrapper);
        reply.appendChild(replyMessage.wrapper);
        var replyActions = node('div', 'reply-actions');
        replyActions.appendChild(node('span', 'muted', lead.lastRepliedAt ? 'Last replied: ' + lead.lastRepliedAt : 'Not replied yet'));
        var send = node('button', 'button', 'Send reply');
        send.type = 'button';
        send.addEventListener('click', function () { sendReply(lead.row, replySubject.input.value, replyMessage.input.value); });
        replyActions.appendChild(send);
        reply.appendChild(replyActions);
        panel.appendChild(reply);

        function field(labelText, type, value, options) {
          var wrapper = node('label');
          wrapper.appendChild(node('span', '', labelText));
          var input = type === 'select' ? node('select') : node(type);
          if (type === 'select') {
            options.forEach(function (option) { input.appendChild(node('option', '', option)); });
          }
          input.value = value || '';
          wrapper.appendChild(input);
          return { wrapper: wrapper, input: input };
        }
      }

      function saveLead(form, row) {
        var fields = form.querySelectorAll('select, input, textarea');
        var changes = { status: fields[0].value, priority: fields[1].value, followUp: fields[2].value, notes: fields[3].value };
        serverCall('updateLead', row, changes).then(function () {
          showNotice('Enquiry updated.', 'success');
          return refresh();
        }).catch(function (error) { showNotice(error.message, 'error'); });
      }

      function sendReply(row, subject, message) {
        if (!message.trim()) { showNotice('Write a reply before sending.', 'error'); return; }
        serverCall('sendLeadReply', row, subject, message).then(function () {
          showNotice('Reply sent from Max\'s Gmail account.', 'success');
          return refresh();
        }).catch(function (error) { showNotice(error.message, 'error'); });
      }

      function render() {
        if (!state.data) return;
        document.getElementById('account').textContent = 'Signed in as ' + state.data.adminEmail;
        renderStats(state.data.stats);
        renderPages(state.data.stats);
        renderLeads(state.data.leads);
        renderDetail();
      }

      function refresh() {
        showNotice('Refreshing…', 'muted');
        return serverCall('getDashboardData').then(function (data) {
          state.data = data;
          if (!state.selectedRow && data.leads.length) state.selectedRow = data.leads[0].row;
          render();
          showNotice('Updated just now.', 'muted');
        }).catch(function (error) { showNotice(error.message, 'error'); });
      }

      document.getElementById('refresh').addEventListener('click', refresh);
      refresh();
    </script>
  </body>
</html>
